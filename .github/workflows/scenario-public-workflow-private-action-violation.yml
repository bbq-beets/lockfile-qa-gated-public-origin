name: scenario / public-workflow-private-action-violation
run-name: lockfile qa / public-workflow-private-action-violation / ${{ inputs.run_id }}
on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
      expected_outcome:
        type: string
      description:
        type: string
permissions:
  contents: read
jobs:
  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: bbq-beets/lockfile-qa-private-action@main
